<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<title>TurnZero — TCG Round Timer</title>
<meta name="theme-color" content="#0b0d14"/>
<link rel="manifest" href="/manifest.json"/>
<link rel="icon" href="/favicon-32.png" sizes="32x32"/>
<link rel="apple-touch-icon" href="/apple-touch-icon.png"/>
<meta name="mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="TurnZero"/>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@600;700&display=swap');


  :root{
    --void:#0b0d14;
    --panel:#131722;
    --panel-2:#1a1f2e;
    --line:#232838;
    --text:#eef1f8;
    --text-dim:#8b93a8;
    --setup:#5b8def;
    --main:#34d399;
    --extra:#f5b942;
    --ended:#f5455c;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    background:radial-gradient(ellipse 900px 600px at 20% -10%, rgba(91,141,239,0.10), transparent 60%), var(--void);
    color:var(--text);font-family:'Inter',sans-serif;min-height:100vh;
  }
  .wrap{max-width:640px;margin:0 auto;padding:22px 18px 70px;}
  .center-wrap{max-width:640px;margin:0 auto;padding:22px 18px 70px;text-align:center;}

  .brand{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:22px;letter-spacing:-0.02em;
    background:linear-gradient(90deg,var(--setup),var(--main));-webkit-background-clip:text;background-clip:text;color:transparent;}
  .sub{color:var(--text-dim);font-size:13px;margin-top:2px;}

  .btn{border:none;border-radius:10px;cursor:pointer;font-family:'Space Grotesk',sans-serif;font-weight:700;min-height:44px;}
  .btn-primary{background:linear-gradient(135deg,var(--setup),#3b6fd6);color:#fff;padding:12px 18px;font-size:14px;}
  .btn-secondary{background:var(--panel-2);color:var(--text);border:1px solid var(--line);padding:12px 18px;font-size:14px;}
  .btn-danger{background:none;color:var(--ended);border:1px solid rgba(245,69,92,0.4);padding:12px 18px;font-size:14px;}
  .btn:active{transform:translateY(1px);}
  .btn-row{display:flex;gap:10px;flex-wrap:wrap;}

  .card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:14px;}
  .field{margin-bottom:14px;}
  .field label{display:block;font-size:12px;color:var(--text-dim);margin-bottom:6px;font-weight:600;}
  .field input,.field select{width:100%;background:var(--panel-2);border:1px solid var(--line);border-radius:9px;
    padding:11px 12px;color:var(--text);font-size:16px;font-family:inherit;}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  @media(max-width:420px){.row2{grid-template-columns:1fr;}}

  .chip-row{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px;}
  .chip{background:var(--panel-2);border:1px solid var(--line);color:var(--text-dim);padding:10px 14px;
    border-radius:20px;font-size:13px;cursor:pointer;font-weight:600;}
  .chip.active{background:rgba(91,141,239,0.18);border-color:var(--setup);color:#a9c4f5;}

  .timer-item{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--panel);
    border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:10px;}
  .timer-item .n{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:15px;}
  .timer-item .m{color:var(--text-dim);font-size:12px;margin-top:2px;}
  .mini-btn{font-size:12px;background:var(--panel-2);border:1px solid var(--line);color:var(--text);
    padding:8px 12px;border-radius:8px;cursor:pointer;white-space:nowrap;}
  .mini-btn:hover{border-color:var(--setup);}

  .phase-badge{display:inline-flex;align-items:center;gap:6px;font-family:'Space Grotesk',sans-serif;font-weight:700;
    font-size:13px;padding:6px 14px;border-radius:20px;text-transform:uppercase;letter-spacing:.05em;margin-bottom:18px;}
  .phase-badge.setup{background:rgba(91,141,239,0.16);color:var(--setup);}
  .phase-badge.main{background:rgba(52,211,153,0.16);color:var(--main);}
  .phase-badge.extra{background:rgba(245,185,66,0.16);color:var(--extra);}
  .phase-badge.ended{background:rgba(245,69,92,0.18);color:var(--ended);}
  .phase-badge.idle{background:var(--panel-2);color:var(--text-dim);}

  .big-clock{font-family:'JetBrains Mono',monospace;font-weight:700;font-variant-numeric:tabular-nums;
    font-size:88px;line-height:1;letter-spacing:-2px;margin:6px 0 8px;transition:color .3s;}
  .big-clock.setup{color:var(--setup);}
  .big-clock.main{color:var(--text);}
  .big-clock.extra{color:var(--extra);}
  .big-clock.ended{color:var(--ended);animation:pulse 1s infinite;}
  @keyframes pulse{0%,100%{opacity:1;}50%{opacity:0.4;}}
  .view-mode .big-clock{font-size:min(22vw,160px);}

  .round-label{font-family:'Space Grotesk',sans-serif;font-size:16px;color:var(--text-dim);margin-bottom:2px;}
  .event-label{font-family:'Space Grotesk',sans-serif;font-size:20px;font-weight:700;margin-bottom:18px;}

  .adjust-row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin:14px 0;}
  .adjust-btn{background:var(--panel-2);border:1px solid var(--line);color:var(--text);border-radius:10px;
    padding:10px 14px;font-family:'JetBrains Mono',monospace;font-weight:700;font-size:13px;cursor:pointer;}
  .adjust-btn:hover{border-color:var(--setup);}

  .section-label{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--text-dim);
    font-weight:700;margin:20px 0 10px;text-align:left;}
  .log-row{display:flex;justify-content:space-between;font-size:12.5px;color:var(--text-dim);padding:7px 0;
    border-bottom:1px solid var(--line);text-align:left;}
  .log-row:last-child{border-bottom:none;}

  .share-box{background:var(--panel-2);border:1px solid var(--line);border-radius:14px;padding:16px;text-align:center;}
  .share-link{font-family:'JetBrains Mono',monospace;font-size:12px;background:var(--panel);border:1px solid var(--line);
    border-radius:8px;padding:10px;word-break:break-all;margin:10px 0;color:var(--text-dim);}
  #qrHolder{display:flex;justify-content:center;margin:14px 0;background:#fff;padding:12px;border-radius:12px;
    width:fit-content;margin-left:auto;margin-right:auto;}

  .tv-code{font-family:'JetBrains Mono',monospace;font-weight:700;font-size:40px;letter-spacing:8px;
    color:var(--main);margin:10px 0;}

  .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--panel-2);
    border:1px solid var(--line);color:var(--text);padding:10px 18px;border-radius:20px;font-size:13px;z-index:70;
    box-shadow:0 8px 24px rgba(0,0,0,0.4);max-width:90vw;text-align:center;}

  .error-box{text-align:center;padding:60px 20px;}
  .error-box .big{font-family:'Space Grotesk',sans-serif;font-size:20px;font-weight:700;margin-bottom:10px;}

  .sound-btn{position:fixed;top:16px;right:16px;background:var(--panel);border:1px solid var(--line);
    color:var(--text-dim);border-radius:20px;padding:8px 14px;font-size:12px;cursor:pointer;z-index:10;}
  .sound-btn.on{color:var(--main);border-color:var(--main);}

  .home-hero{text-align:center;padding:20px 0 10px;}

  .scan-overlay{position:fixed;inset:0;background:#000;z-index:80;display:flex;flex-direction:column;}
  .scan-video-wrap{flex:1;position:relative;overflow:hidden;}
  .scan-video-wrap video{width:100%;height:100%;object-fit:cover;}
  .scan-frame{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:min(70vw,280px);height:min(70vw,280px);
    border:3px solid var(--main);border-radius:20px;box-shadow:0 0 0 2000px rgba(0,0,0,0.45);}
  .scan-footer{padding:18px;text-align:center;background:var(--void);}
  .scan-status{color:var(--text-dim);font-size:13px;margin-bottom:12px;}

  .report-banner{background:rgba(245,185,66,0.14);border:1px solid var(--extra);color:var(--extra);
    border-radius:12px;padding:14px 18px;font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:15px;
    margin:14px auto 0;max-width:360px;}

  .tour-overlay{position:fixed;inset:0;background:rgba(5,6,10,0.78);backdrop-filter:blur(3px);
    display:flex;align-items:center;justify-content:center;z-index:90;padding:20px;}
  .tour-card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:26px 22px;
    max-width:420px;width:100%;text-align:center;}
  .tour-dots{display:flex;justify-content:center;gap:6px;margin-bottom:18px;}
  .tour-dot{height:6px;border-radius:3px;background:var(--line);transition:width .2s,background .2s;}
  .tour-dot.active{background:var(--setup);}

  .multi-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;padding:16px;max-width:1100px;margin:0 auto;}
  @media(max-width:720px){.multi-grid{grid-template-columns:1fr;}}
  .multi-grid.count-1{grid-template-columns:1fr;max-width:640px;}
  .multi-grid.count-3{grid-template-columns:1fr 1fr;}
  .multi-cell{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:20px;text-align:center;}
  .multi-cell .big-clock{font-size:min(9vw,64px);}
  .multi-cell .event-label{font-size:16px;margin-bottom:8px;}
  .multi-cell .round-label{font-size:13px;}
</style>
</head>
<body>
<div id="app"></div>

<!--
  ============================================================
  SETUP REQUIRED — see SETUP.md. Config lives in config.js, a separate
  file next to this one — never edit this file itself.
  ============================================================
-->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
<script src="/config.js"></script>
<script>
(function(){
  const CFG = window.ROUNDTIMER_CONFIG || {};
  const SUPABASE_URL = CFG.SUPABASE_URL || 'YOUR_SUPABASE_URL';
  const SUPABASE_ANON_KEY = CFG.SUPABASE_ANON_KEY || 'YOUR_SUPABASE_ANON_KEY';
  const VAPID_PUBLIC_KEY = CFG.VAPID_PUBLIC_KEY || '';
  const configured = SUPABASE_URL.startsWith('http') && SUPABASE_ANON_KEY.length > 15;
  const app = document.getElementById('app');

  if(!configured){
    app.innerHTML = `
      <div class="wrap">
        <div class="card">
          <h2>⚙️ One setup step</h2>
          <p style="color:var(--text-dim);line-height:1.6;">This app needs a free Supabase project. Follow <code>SETUP.md</code>, then edit <code>config.js</code> with your Project URL and anon key, and reload.</p>
        </div>
      </div>`;
    return;
  }

  const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  if('serviceWorker' in navigator){
    navigator.serviceWorker.register('/sw.js').catch(()=>{});
  }

  function urlBase64ToUint8Array(base64String){
    const padding = '='.repeat((4 - base64String.length % 4) % 4);
    const base64 = (base64String + padding).replace(/-/g,'+').replace(/_/g,'/');
    const rawData = atob(base64);
    const arr = new Uint8Array(rawData.length);
    for(let i=0;i<rawData.length;i++) arr[i] = rawData.charCodeAt(i);
    return arr;
  }
  async function isSubscribedToTimer(timerId){
    if(!('serviceWorker' in navigator)) return false;
    try{
      const reg = await navigator.serviceWorker.getRegistration();
      const sub = reg ? await reg.pushManager.getSubscription() : null;
      if(!sub) return false;
      const { data } = await supabase.from('timer_push_subscriptions').select('id').eq('endpoint', sub.endpoint).eq('timer_id', timerId).maybeSingle();
      return !!data;
    }catch(e){ return false; }
  }
  async function subscribeToTimerPush(timerId){
    if(!VAPID_PUBLIC_KEY){ showToast("Push isn't configured for this deployment"); return false; }
    if(!('serviceWorker' in navigator) || !('PushManager' in window)){ showToast("Push notifications aren't supported in this browser"); return false; }
    try{
      const reg = await navigator.serviceWorker.register('/sw.js');
      const perm = await Notification.requestPermission();
      if(perm !== 'granted'){ showToast('Notification permission was denied'); return false; }
      const sub = await reg.pushManager.subscribe({ userVisibleOnly:true, applicationServerKey: urlBase64ToUint8Array(VAPID_PUBLIC_KEY) });
      const j = sub.toJSON();
      const { error } = await supabase.from('timer_push_subscriptions').upsert({
        timer_id: timerId, endpoint: j.endpoint, p256dh: j.keys.p256dh, auth: j.keys.auth
      }, { onConflict: 'endpoint' });
      if(error){ showToast('Could not save subscription'); return false; }
      return true;
    }catch(e){ console.error(e); showToast('Could not enable push notifications'); return false; }
  }

  const GAME_PRESETS = {
    riftbound:  { label: 'Riftbound',           main: 50*60, extra: 0 },
    onepiece:   { label: 'One Piece Card Game', main: 30*60, extra: 5*60 },
    yugioh:     { label: 'Yu-Gi-Oh!',           main: 50*60, extra: 0 },
    pokemon_bo1:{ label: 'Pokémon (Bo1)',       main: 30*60, extra: 10*60 },
    pokemon_bo3:{ label: 'Pokémon (Bo3)',       main: 50*60, extra: 10*60 },
    custom:     { label: 'Custom',              main: 30*60, extra: 0 }
  };

  function uid(){ return Math.random().toString(36).slice(2,10); }
  // Avoids ambiguous characters (0/O, 1/I/L) so it's easy to read and type on a TV remote.
  const SHORT_CODE_ALPHABET = 'ABCDEFGHJKMNPQRSTUVWXYZ23456789';
  function generateShortCode(){
    let s = '';
    for(let i=0;i<4;i++) s += SHORT_CODE_ALPHABET[Math.floor(Math.random()*SHORT_CODE_ALPHABET.length)];
    return s;
  }
  function showToast(msg){
    document.querySelectorAll('.toast').forEach(t=>t.remove());
    const t = document.createElement('div');
    t.className='toast'; t.textContent=msg;
    document.body.appendChild(t);
    setTimeout(()=>t.remove(), 2400);
  }
  function copyText(str){
    try{ navigator.clipboard.writeText(str); return true; }
    catch(e){
      try{
        const ta=document.createElement('textarea'); ta.value=str; ta.style.position='fixed'; ta.style.opacity='0';
        document.body.appendChild(ta); ta.select(); document.execCommand('copy'); ta.remove(); return true;
      }catch(e2){ return false; }
    }
  }
  function fmtTime(totalSeconds){
    totalSeconds = Math.max(0, Math.round(totalSeconds));
    const h = Math.floor(totalSeconds/3600);
    const m = Math.floor((totalSeconds%3600)/60);
    const s = totalSeconds%60;
    const mm = String(m).padStart(2,'0'), ss = String(s).padStart(2,'0');
    return h>0 ? `${h}:${mm}:${ss}` : `${mm}:${ss}`;
  }
  function baseUrl(){
    return window.location.origin + window.location.pathname;
  }

  // ---------- Local "my timers" list (per-device, no account needed) ----------
  function getMyTimers(){
    try{ return JSON.parse(localStorage.getItem('rt_my_timers')||'[]'); }catch(e){ return []; }
  }
  function saveMyTimers(list){
    try{ localStorage.setItem('rt_my_timers', JSON.stringify(list)); }catch(e){}
  }
  function addMyTimer(entry){
    const list = getMyTimers().filter(t=>t.id !== entry.id);
    list.unshift(entry);
    saveMyTimers(list.slice(0,30));
  }
  function removeMyTimer(id){
    saveMyTimers(getMyTimers().filter(t=>t.id!==id));
  }

  // ---------- Timer math (all derived from timestamps — no drift, no server ticking needed) ----------
  function getElapsedSeconds(timer){
    let e = Number(timer.accumulated_seconds) || 0;
    if(timer.status === 'running' && timer.running_since){
      e += (Date.now() - new Date(timer.running_since).getTime())/1000;
    }
    return Math.max(0, e);
  }
  function getPhaseInfo(timer){
    if(timer.status === 'ended') return { phase:'ended', remaining:0 };
    if(timer.status === 'idle') return { phase:'idle', remaining: timer.setup_seconds || timer.main_seconds };
    const elapsed = getElapsedSeconds(timer);
    if(elapsed < timer.setup_seconds) return { phase:'setup', remaining: timer.setup_seconds - elapsed };
    const mainElapsed = elapsed - timer.setup_seconds;
    if(mainElapsed < timer.main_seconds) return { phase:'main', remaining: timer.main_seconds - mainElapsed };
    const extraElapsed = mainElapsed - timer.main_seconds;
    if(timer.extra_seconds > 0 && extraElapsed < timer.extra_seconds) return { phase:'extra', remaining: timer.extra_seconds - extraElapsed };
    return { phase:'ended', remaining:0 };
  }

  // ---------- Sound ----------
  let audioCtx = null;
  let soundOn = false;
  function unlockAudio(){
    if(!audioCtx){
      try{ audioCtx = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){}
    }
    soundOn = !!audioCtx;
  }
  function beep(freq, dur, delay){
    delay = delay||0;
    setTimeout(()=>{
      if(!audioCtx) return;
      const osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
      osc.frequency.value = freq; osc.type='sine'; gain.gain.value=0.25;
      osc.connect(gain); gain.connect(audioCtx.destination);
      osc.start(); setTimeout(()=>osc.stop(), dur);
    }, delay);
  }
  function playAlert(kind){
    if(!soundOn) return;
    if(kind==='fifteen'){ beep(660,150,0); beep(660,150,220); }
    else if(kind==='five'){ beep(880,180,0); beep(880,180,250); beep(880,180,500); }
    else if(kind==='extra'){ beep(520,450,0); }
    else if(kind==='ended'){ beep(220,650,0); beep(220,650,700); }
  }
  function renderSoundBtn(){
    const b = document.createElement('button');
    b.className = 'sound-btn' + (soundOn?' on':'');
    b.textContent = soundOn ? '🔊 Sound on' : '🔈 Enable sound';
    b.onclick = ()=>{ unlockAudio(); renderSoundBtn(); showToast(soundOn?'Sound enabled':'Could not enable sound'); };
    const old = document.querySelector('.sound-btn');
    if(old) old.remove();
    document.body.appendChild(b);
  }

  // ============================================================
  // ROUTING
  // ============================================================
  const params = new URLSearchParams(window.location.search);

  if(params.has('control') && params.has('t')){
    renderControlPage(params.get('control'), params.get('t'));
  } else if(params.has('multi')){
    renderMultiPage(params.get('multi').split(',').map(s=>s.trim()).filter(Boolean).slice(0,4));
  } else if(params.has('view')){
    renderViewPage(params.get('view'));
  } else if(params.has('tv')){
    renderTvCodePage(params.get('tv').trim().toUpperCase());
  } else {
    renderHome();
  }

  async function renderTvCodePage(code){
    app.innerHTML = `<div class="center-wrap"><div class="sub">Looking up ${escapeHtml(code)}…</div></div>`;
    try{
      const { data, error } = await supabase.from('timers').select('id').eq('short_code', code).maybeSingle();
      if(error || !data){
        app.innerHTML = `<div class="wrap"><div class="error-box">
          <div class="big">Code not found</div>
          <div class="sub">Double-check the code with the judge — it's 4 characters, e.g. 7K3M.</div>
        </div></div>`;
        return;
      }
      renderViewPage(data.id);
    }catch(e){
      app.innerHTML = `<div class="wrap"><div class="error-box"><div class="big">Something went wrong</div></div></div>`;
    }
  }

  // ============================================================
  // HOME
  // ============================================================
  const TOUR_STEPS = [
    {
      title: 'Welcome to TurnZero 👋',
      body: "A shared round timer for TCG events. No accounts, no sign-in for anyone — just links. Here's a quick tour."
    },
    {
      title: 'Create a timer',
      body: 'Pick a game preset (or set a custom time), add a setup period if you need one, and tap Create. This one timer covers the whole event, not just one round.'
    },
    {
      title: 'Share it once',
      body: 'You get a private control link (yours only — don\'t share it) and a view link + QR code for players. Tap "Next round" between rounds and the same link just keeps working — no re-sharing needed.'
    },
    {
      title: 'Players just watch',
      body: 'They scan the QR code, or use the "📷 Scan QR" button right on this home screen — no app to install, no link to type in.'
    },
    {
      title: 'More when you need it',
      body: 'Pause and adjust time mid-round, log penalties that stick around for the whole event, run up to 4 tables on one screen, and turn on push alerts for 15/10/5-minute and time\'s-up notifications.'
    },
    {
      title: "You're set 🎉",
      body: "That's everything. Jump in and create your first timer."
    }
  ];

  let tourShown = false;
  function maybeShowTour(){
    if(tourShown) return;
    let seen = false;
    try{ seen = localStorage.getItem('tz_tour_seen') === '1'; }catch(e){}
    if(seen) return;
    tourShown = true;

    let step = 0;
    const overlay = document.createElement('div');
    overlay.className = 'tour-overlay';
    // A close button that always exists, independent of anything below —
    // so there's always a way out even if something else goes wrong.
    overlay.innerHTML = `<button id="tourCloseX" style="position:absolute;top:16px;right:16px;background:none;border:none;color:var(--text-dim);font-size:22px;cursor:pointer;line-height:1;">✕</button><div id="tourCardHolder"></div>`;
    document.body.appendChild(overlay);

    function finish(){
      overlay.remove();
      try{ localStorage.setItem('tz_tour_seen', '1'); }catch(e){}
    }
    overlay.querySelector('#tourCloseX').onclick = finish;
    overlay.onclick = (e)=>{ if(e.target===overlay) finish(); };

    function dotsHtml(){
      let out = '';
      for(let i=0;i<TOUR_STEPS.length;i++){
        const active = i===step;
        out += '<div class="tour-dot' + (active?' active':'') + '" style="width:' + (active?18:6) + 'px;"></div>';
      }
      return out;
    }

    function draw(){
      try{
        const s = TOUR_STEPS[step];
        const isLast = step === TOUR_STEPS.length-1;
        const backOrSkipHtml = step>0
          ? '<button class="btn btn-secondary" id="tourBack" style="flex:1;">Back</button>'
          : '<button class="btn btn-secondary" id="tourSkip" style="flex:1;">Skip</button>';
        const holder = overlay.querySelector('#tourCardHolder');
        holder.innerHTML = `
          <div class="tour-card">

  // ---------- QR scanner (players: point camera at a judge's QR code) ----------
  async function openQrScanner(){
    if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
      showToast('Camera access isn\'t supported in this browser'); return;
    }
    if(!window.jsQR){
      showToast('QR scanning library failed to load — check your connection and reload the page'); return;
    }
    const overlay = document.createElement('div');
    overlay.className = 'scan-overlay';
    overlay.innerHTML = `
      <div class="scan-video-wrap">
        <video id="scanVideo" playsinline autoplay muted></video>
        <div class="scan-frame"></div>
      </div>
      <div class="scan-footer">
        <div class="scan-status" id="scanStatus">Point your camera at the judge's QR code</div>
        <button class="btn btn-secondary" id="scanCancelBtn">Cancel</button>
      </div>`;
    document.body.appendChild(overlay);

    let stream = null;
    let stopped = false;
    const video = overlay.querySelector('#scanVideo');
    const canvas = document.createElement('canvas');
    const ctx = canvas.getContext('2d');

    function stop(){
      stopped = true;
      if(stream) stream.getTracks().forEach(t=>t.stop());
      overlay.remove();
    }
    overlay.querySelector('#scanCancelBtn').onclick = stop;

    try{
      stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
      video.srcObject = stream;
      await video.play();
    }catch(e){
      overlay.querySelector('#scanStatus').textContent = 'Could not access the camera — check your browser permissions.';
      return;
    }

    function tick(){
      if(stopped) return;
      if(video.readyState === video.HAVE_ENOUGH_DATA){
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
        const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
        const code = window.jsQR ? jsQR(imageData.data, imageData.width, imageData.height) : null;
        if(code && code.data){
          overlay.querySelector('#scanStatus').textContent = 'Found it — opening…';
          stop();
          try{
            const u = new URL(code.data);
            window.location.href = u.toString();
          }catch(e){
            showToast('That QR code doesn\'t look like a TurnZero link');
          }
          return;
        }
      }
      requestAnimationFrame(tick);
    }
    requestAnimationFrame(tick);
  }

      return;
    }
    addMyTimer({ id: timer.id, control_token: timer.control_token, label: timer.label });

    let current = timer;
    let alertedKeys = new Set();
    let endedFinalized = false;
    let tickInterval = null;
    let pushSubscribed = await isSubscribedToTimer(timer.id);

    async function refresh(){
      const { data } = await supabase.from('timers').select('*').eq('id', id).maybeSingle();
      if(data) current = data;
    }

    async function writeUpdate(patch){
      const { data, error } = await supabase.from('timers').update(patch)
        .eq('id', id).eq('control_token', token).select().maybeSingle();
      if(error || !data){ showToast('Could not update — check your connection'); return; }
      current = data;
      draw();
    }

    function logAdjustment(deltaSeconds, note){
      const log = (current.adjustments||[]).slice(-19);
      log.push({ at: new Date().toISOString(), delta_seconds: deltaSeconds, note });
      return log;
    }

    async function startTimer(){
      await writeUpdate({ status:'running', accumulated_seconds:0, running_since:new Date().toISOString(),
        notified_15:false, notified_10:false, notified_5:false, notified_end:false });
      alertedKeys = new Set();
      endedFinalized = false;
    }
    async function pauseTimer(){
      const elapsed = getElapsedSeconds(current);
      await writeUpdate({ status:'paused', accumulated_seconds: elapsed, running_since: null });
    }
    async function resumeTimer(){
      await writeUpdate({ status:'running', running_since: new Date().toISOString() });
    }
    async function endTimer(){
      await writeUpdate({ status:'ended', running_since:null });
    }
    async function nextRound(){
      await writeUpdate({ status:'idle', accumulated_seconds:0, running_since:null, round_number: (current.round_number||1)+1, adjustments:[],
        notified_15:false, notified_10:false, notified_5:false, notified_end:false });
      alertedKeys = new Set();
      endedFinalized = false;
    }
    async function adjustTime(deltaMinutes){
      const deltaSeconds = deltaMinutes*60;
      const elapsed = getElapsedSeconds(current);
      // Subtracting from elapsed = adding time remaining, and vice versa.
      const newAccumulated = Math.max(0, elapsed - deltaSeconds);
      const note = (deltaMinutes>0?'+':'') + deltaMinutes + ' min';
      const log = logAdjustment(deltaSeconds, note);
      if(current.status === 'running'){
        await writeUpdate({ accumulated_seconds: newAccumulated, running_since: new Date().toISOString(), adjustments: log });
      } else {
        await writeUpdate({ accumulated_seconds: newAccumulated, adjustments: log });
      }
    }
    async function changeRoundBy(delta){
      await writeUpdate({ round_number: Math.max(1, (current.round_number||1)+delta) });
    }
    async function addPenalty(entry){
      const log = (current.penalties||[]).concat([{ id: uid(), at: new Date().toISOString(), ...entry }]);
      await writeUpdate({ penalties: log });
    }

      const clockEl = document.querySelector('.big-clock');
      const badgeEl = document.querySelector('.phase-badge');
      if(clockEl){ clockEl.textContent = fmtTime(info.remaining); clockEl.className = 'big-clock ' + info.phase; }
      if(badgeEl){ badgeEl.textContent = phaseText(info.phase); badgeEl.className = 'phase-badge ' + info.phase; }

      if(current.status==='running'){
        const key15 = info.phase==='main' ? Math.floor(info.remaining/900) : null;
        if(key15!=null && key15>0 && !alertedKeys.has('15-'+key15) && info.remaining <= key15*900+1){
          alertedKeys.add('15-'+key15); playAlert('fifteen');
        }
        if(info.remaining<=300 && info.remaining>295 && !alertedKeys.has('five')){
          alertedKeys.add('five'); playAlert('five');
        }
        if(info.phase==='extra' && !alertedKeys.has('extra')){
          alertedKeys.add('extra'); playAlert('extra');
        }
        if(info.phase==='ended' && !endedFinalized){
          endedFinalized = true;
          playAlert('ended');
          writeUpdate({ status:'ended', running_since:null });
        }
      }
    }

    draw();
    tickInterval = setInterval(tick, 1000);

    supabase.channel('timer-ctrl-'+id)
      .on('postgres_changes', { event:'UPDATE', schema:'public', table:'timers', filter:`id=eq.${id}` }, payload=>{
        current = payload.new; draw();
      })
      .subscribe();
  }

  // ============================================================
  // VIEW PAGE (players / spectators — read only)
  // ============================================================
  async function renderViewPage(id){
    renderSoundBtn();
    app.innerHTML = `<div class="center-wrap"><div class="sub">Loading…</div></div>`;

    const { data: timer, error } = await supabase.from('timers').select('*').eq('id', id).maybeSingle();
    if(error || !timer){
      app.innerHTML = `<div class="wrap"><div class="error-box">
        <div class="big">Timer not found</div>
        <div class="sub">This link doesn't match any timer.</div>
      </div></div>`;
      return;
    }

    let current = timer;
    let alertedKeys = new Set();
    let pushSubscribed = await isSubscribedToTimer(timer.id);

    function phaseText(p){
      return { idle:'Not started yet', setup:'Setup time', main:'Round in progress', extra:'Extra time', ended:'Time!' }[p] || p;
    }

    function draw(){
      const info = getPhaseInfo(current);
      app.innerHTML = `
        <div class="center-wrap view-mode">
          <div class="round-label">Round ${current.round_number||1}</div>
          <div class="event-label">${escapeHtml(current.label||'Timer')}</div>
          <div class="phase-badge ${info.phase}">${phaseText(info.phase)}</div>
          <div class="big-clock ${info.phase}">${fmtTime(info.remaining)}</div>
          ${info.phase==='ended' ? `<div class="report-banner">📝 Time's up — please report your results to the judge</div>` : ''}
          <button class="mini-btn" id="btnPushToggleView" style="margin-top:14px;">${pushSubscribed ? '🔔 Alerts on for this timer' : '🔔 Get alerts for this timer'}</button>
        </div>`;
      document.getElementById('btnPushToggleView').onclick = async ()=>{
        if(pushSubscribed){ showToast('Already getting alerts for this timer'); return; }
        const ok = await subscribeToTimerPush(current.id);
        if(ok){ pushSubscribed = true; showToast("You'll get alerts at 15 min in, 10/5 min left, and time's up"); draw(); }
      };
    }

    function tick(){
      const info = getPhaseInfo(current);
      const clockEl = document.querySelector('.big-clock');
      const badgeEl = document.querySelector('.phase-badge');
      if(clockEl){ clockEl.textContent = fmtTime(info.remaining); clockEl.className='big-clock '+info.phase; }
      if(badgeEl){ badgeEl.textContent = phaseText(info.phase); badgeEl.className='phase-badge '+info.phase; }

      if(current.status==='running'){
        const key15 = info.phase==='main' ? Math.floor(info.remaining/900) : null;
        if(key15!=null && key15>0 && !alertedKeys.has('15-'+key15) && info.remaining <= key15*900+1){
          alertedKeys.add('15-'+key15); playAlert('fifteen');
        }
        if(info.remaining<=300 && info.remaining>295 && !alertedKeys.has('five')){
          alertedKeys.add('five'); playAlert('five');
        }
        if(info.phase==='extra' && !alertedKeys.has('extra')){
          alertedKeys.add('extra'); playAlert('extra');
        }
        if(info.phase==='ended' && !alertedKeys.has('ended')){
          alertedKeys.add('ended'); playAlert('ended');
          draw();
        }
      }
    }

    draw();
    setInterval(tick, 1000);

    supabase.channel('timer-view-'+id)
      .on('postgres_changes', { event:'UPDATE', schema:'public', table:'timers', filter:`id=eq.${id}` }, payload=>{
        current = payload.new; alertedKeys = new Set(); draw();
      })
      .subscribe();
  }

  // ============================================================
  // MULTI-VIEW (up to 4 timers on one screen — for a store running
  // several events at once, e.g. on a TV or a shared spectator screen)
  // ============================================================
  async function renderMultiPage(ids){
    renderSoundBtn();
    if(ids.length === 0){
      app.innerHTML = `<div class="wrap"><div class="error-box"><div class="big">No timers selected</div>
        <div style="margin-top:16px;"><a class="btn btn-secondary" href="${baseUrl()}">Go home</a></div></div></div>`;
      return;
    }
    app.innerHTML = `<div class="center-wrap"><div class="sub">Loading…</div></div>`;

    const { data, error } = await supabase.from('timers').select('*').in('id', ids);
    if(error || !data || data.length === 0){
      app.innerHTML = `<div class="wrap"><div class="error-box"><div class="big">Couldn't load those timers</div>
        <div style="margin-top:16px;"><a class="btn btn-secondary" href="${baseUrl()}">Go home</a></div></div></div>`;
      return;
    }
    // Preserve the order the caller requested, in case it matters to them.
    const timers = ids.map(id => data.find(t=>t.id===id)).filter(Boolean);
    const stateById = {};
    timers.forEach(t => stateById[t.id] = t);

    function phaseText(p){
      return { idle:'Not started', setup:'Setup', main:'In progress', extra:'Extra time', ended:'Time!' }[p] || p;
    }

    function drawAll(){
      app.innerHTML = `<div class="multi-grid count-${timers.length}">
        ${timers.map(t => `
          <div class="multi-cell" id="cell-${t.id}">
            <div class="round-label">Round ${stateById[t.id].round_number||1}</div>
            <div class="event-label">${escapeHtml(stateById[t.id].label||'Timer')}</div>
            <div class="phase-badge idle" id="badge-${t.id}"></div>
            <div class="big-clock" id="clock-${t.id}"></div>
          </div>`).join('')}
      </div>`;
      timers.forEach(t => tickOne(t.id));
    }

    function tickOne(id){
      const info = getPhaseInfo(stateById[id]);
      const clockEl = document.getElementById('clock-'+id);
      const badgeEl = document.getElementById('badge-'+id);
      if(clockEl){ clockEl.textContent = fmtTime(info.remaining); clockEl.className = 'big-clock ' + info.phase; }
      if(badgeEl){ badgeEl.textContent = phaseText(info.phase); badgeEl.className = 'phase-badge ' + info.phase; }
    }

    drawAll();
    setInterval(()=>timers.forEach(t=>tickOne(t.id)), 1000);

    timers.forEach(t=>{
      supabase.channel('timer-multi-'+t.id)
        .on('postgres_changes', { event:'UPDATE', schema:'public', table:'timers', filter:`id=eq.${t.id}` }, payload=>{
          stateById[t.id] = payload.new;
          tickOne(t.id);
        })
        .subscribe();
    });
  }
})();
</script>
</body>
